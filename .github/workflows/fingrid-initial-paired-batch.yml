name: One-time initial Fingrid 2025 paired source batch
on:
  push:
    branches:
      - source-runs/fingrid-2025-initial-paired-batch
    paths:
      - ".github/workflows/fingrid-initial-paired-batch.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: fingrid-source-recovery-limited
  cancel-in-progress: false
jobs:
  audited-initial-batch:
    if: github.repository == 'abhijith-sivaprasadan/finnish-grid-connection-evidence' && github.ref == 'refs/heads/source-runs/fingrid-2025-initial-paired-batch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FINGRID_API_KEY: ${{ secrets.FINGRID_API_KEY }}
    steps:
      - name: Check out immutable source-audited code (do not use arbitrary branch code)
        uses: actions/checkout@v4
        with:
          ref: 33b2b5ce5e29790288c34b77e56f97405ebaec43
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-model.txt
      - name: Install isolated source-journal prerequisites
        run: python -m pip install -r requirements-model.txt requests==2.34.2
      - name: Offline tests before original-source requests
        run: python -m pytest -q tests/test_recover_fingrid_gaps.py tests/test_annual_journal.py tests/test_pypsa_matched_windows.py
      - name: Confirm source credential is configured (never display it)
        shell: bash
        run: |
          if [ -z "${FINGRID_API_KEY:-}" ]; then
            echo "::error::FINGRID_API_KEY unavailable. No external requests attempted."
            exit 1
          fi
      - name: One bounded first batch of up to 8 original operator-source chunks
        shell: bash
        run: |
          mkdir -p /tmp/fingrid-recovery/chunks
          python -m src.models.annual_journal \
            --execute \
            --max-new-chunks 8 \
            --dir /tmp/fingrid-recovery/chunks
      - name: Check source inventory explicitly rejects incomplete calendar 2025
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("/tmp/fingrid-recovery/chunks/annual_2025_journal_audit.json").read_text())
          assert j["full_calendar_2025_source_verified"] is False
          assert j["annual_energy_total_verified"] is False
          assert j["new_original_source_chunks_saved_this_run"] <= 8
          assert j["confirmed_original_paired_slots_captured"] <= 4*7*96
          assert j["paired_calendar_day_counts"]["all_calendar_days"] == 365
          assert j["paired_calendar_day_counts"]["unknown_not_downloaded"] > 0
          print("INITIAL_SOURCE_BATCH_AUDIT_JSON="+json.dumps({
            "state":j["collection_status"],
            "new_chunks":j["new_original_source_chunks_saved_this_run"],
            "paired_source_intervals":j["confirmed_original_paired_slots_captured"],
            "daily_coverage":j["paired_calendar_day_counts"],
            "rate_limit_or_source_error_deferred":j["rate_limit_or_access_deferred"]
          },sort_keys=True))
          PY
      - name: Preserve exact original records and partial audit for future manual resume
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fingrid-original-2025-recovery
          path: /tmp/fingrid-recovery/
          if-no-files-found: ignore
          retention-days: 30

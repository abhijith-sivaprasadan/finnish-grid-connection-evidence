name: Finland 2024-2025 spatial concordance, licence-gated
on:
  push:
    branches: [feature/fi-2025-spatial-concordance-license-gated]
    paths:
      - 'src/models/fi_spatial_concordance_2025.py'
      - 'tests/test_fi_spatial_concordance_2025.py'
      - '.github/workflows/fi-spatial-concordance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-geometry-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audited geospatial dependencies
        run: |
          python -m pip install pytest==8.4.2 shapely==2.1.2 pyproj==3.7.2
      - name: Verify synthetic geometry and rights controls
        run: |
          python -m pytest -q tests/test_fi_spatial_concordance_2025.py
      - name: Reconstruct ODbL 2024 Finland source, verify Zenodo MD5 originals
        run: |
          python -m src.models.osm_finland_topology_audit --download --source-dir /tmp/fi-osm-2024-original --output-dir /tmp/fi-osm-2024-extract
      - name: Access 2025 third-party FCG map ONLY in ephemeral memory; output AGGREGATES
        run: |
          python -m src.models.fi_spatial_concordance_2025 --osm-dir /tmp/fi-osm-2024-extract --out /tmp/fi-geographic-concordance/AGGREGATED_COUNTS_ONLY.json
      - name: Archive aggregate statistics without source FCG shapes, coordinates or IDs
        uses: actions/upload-artifact@v4
        with:
          name: fi-2024-2025-geometry-AGGREGATES-only-licence-unconfirmed
          path: /tmp/fi-geographic-concordance/AGGREGATED_COUNTS_ONLY.json
          retention-days: 60

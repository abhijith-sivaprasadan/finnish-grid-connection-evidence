name: Krios engineering lab (isolated pandapower, PyPSA and cross-check)
on:
  push:
    branches: [main, feature/krios-engineering-lab-pandapower-pypsa]
    paths:
      - 'src/models/cigre_engineering_lab.py'
      - 'src/models/ac_cross_solver_reference.py'
      - 'src/models/ac_comparison_validate.py'
      - 'src/models/fi_regional_pypsa_v2.py'
      - 'src/models/fi_osm_uncertainty_2024.py'
      - 'tests/test_pandapower_lab.py'
      - 'tests/test_pypsa_regional_v2.py'
      - 'tests/test_ac_comparison_validate.py'
      - 'requirements-pandapower-lab.txt'
      - 'requirements-model.txt'
      - '.github/workflows/krios-engineering-benchmarks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pandapower-ac:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-pandapower-lab.txt
      - name: Install pandapower 3.5.6 with required pandas 2.3
        run: python -m pip install -r requirements-pandapower-lab.txt
      - name: Actual CIGRE HV/MV benchmark + N-1 tests
        run: python -m pytest -q tests/test_pandapower_lab.py
      - name: Solve CIGRE HV/MV and independent pandapower AC reference
        run: |
          python -m src.models.cigre_engineering_lab --out /tmp/pp-out/cigre_ac_n1.json
          python -m src.models.ac_cross_solver_reference --solver pandapower --out /tmp/pp-out/pandapower_threebus_ac.json
      - uses: actions/upload-artifact@v4
        with:
          name: krios-pandapower-cigre-and-3bus
          path: /tmp/pp-out/*.json
          retention-days: 60
  pypsa-regional:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-model.txt
      - name: Install existing PyPSA 1.4 pandas 3 and HiGHS env
        run: python -m pip install -r requirements-model.txt
      - name: Test actual PyPSA full AC and checksum-pinned regional FI model
        run: python -m pytest -q tests/test_pypsa_regional_v2.py
      - name: Run PyPSA regional 192 real national intervals and AC 3bus
        run: |
          python -m src.models.fi_regional_pypsa_v2 --out /tmp/pypsa-out/finland_region_assumptions_v2.json
          python -m src.models.ac_cross_solver_reference --solver pypsa --out /tmp/pypsa-out/pypsa_threebus_ac.json
      - uses: actions/upload-artifact@v4
        with:
          name: krios-pypsa-v2-and-3bus
          path: /tmp/pypsa-out/*.json
          retention-days: 60
  independently-compare-ac-solvers:
    needs: [pandapower-ac, pypsa-regional]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.4.2
      - run: python -m pytest -q tests/test_ac_comparison_validate.py
      - uses: actions/download-artifact@v4
        with:
          name: krios-pandapower-cigre-and-3bus
          path: /tmp/input-pp/
      - uses: actions/download-artifact@v4
        with:
          name: krios-pypsa-v2-and-3bus
          path: /tmp/input-pypsa/
      - name: Compare independently solved, identically parameterized full AC power flow
        run: |
          python -m src.models.ac_comparison_validate --pandapower /tmp/input-pp/pandapower_threebus_ac.json --pypsa /tmp/input-pypsa/pypsa_threebus_ac.json --out /tmp/ac-verified/independent_ac_comparison.json
      - uses: actions/upload-artifact@v4
        with:
          name: krios-two-engine-ac-cross-validation
          path: /tmp/ac-verified/independent_ac_comparison.json
          retention-days: 60
  osm-template-uncertainty:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck five native Zenodo source CSVs and ODbL licence
        run: |
          python -m src.models.osm_finland_topology_audit --download --source-dir /tmp/fi-original --output-dir /tmp/fi-verified
      - name: Source-voltage template uncertainty without false 2025 calibration
        run: |
          python -m src.models.fi_osm_uncertainty_2024 --extracted-dir /tmp/fi-verified --out /tmp/fi-odbl/osm-rating-sensitivity-2024.json
      - name: ODbL attribution
        run: |
          printf '%s\n' '© OpenStreetMap contributors; PyPSA-Eur OSM v0.6, DOI 10.5281/zenodo.14144752' 'ODbL 1.0 derived metrics, NOT actual Fingrid electrical calibration.' > /tmp/fi-odbl/DATA_LICENSE_ODBL.txt
      - uses: actions/upload-artifact@v4
        with:
          name: finland-osm-2024-input-uncertainty-ODbL-no-operator-calibration
          path: /tmp/fi-odbl/*
          retention-days: 45

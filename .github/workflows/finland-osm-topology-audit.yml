name: Finland OSM topology provenance audit
on:
  push:
    branches: [feature/fi-physical-osm-v06-audit]
    paths:
      - 'src/models/osm_finland_topology_audit.py'
      - 'tests/test_osm_finland_topology_audit.py'
      - '.github/workflows/finland-osm-topology-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-reconstruction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run synthetic fail-closed tests
        run: |
          python -m pip install pytest==8.4.2
          python -m pytest -q tests/test_osm_finland_topology_audit.py
      - name: Download and checksum-verify 2024 ODbL source; audit Finnish assets
        run: |
          python -m src.models.osm_finland_topology_audit --source-dir /tmp/zenodo-osm-06 --output-dir /tmp/fi-osm-06 --download
      - name: Archive attributed licensed Finnish source extract and structural audit
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fi-osm-v06-proxy-evidence-ODbL
          path: /tmp/fi-osm-06/
          retention-days: 90

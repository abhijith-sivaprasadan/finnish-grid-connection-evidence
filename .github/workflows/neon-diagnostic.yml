name: Neon connection diagnosis (safe read-only)

on:
  # Fires only when this diagnostic workflow file is initially added or edited
  # on main, never on ordinary code pushes or untrusted pull requests.
  push:
    branches:
      - main
    paths:
      - .github/workflows/neon-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      NEON_BRANCH_NAME: ${{ vars.NEON_BRANCH_NAME || 'production' }}
      NEON_DATABASE_NAME: ${{ vars.NEON_DATABASE_NAME || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Diagnose Neon API connection without database writes
        run: python -m src.neon_connection

name: Rebuild website lockfile cleanly once
on:
  push:
    branches: [feat/nextjs-rest-atlas-v1]
    paths: [.github/workflows/generate-web-lock-once.yml]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recreate lock from scratch (remove legacy sharp optional entries)
        working-directory: website
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated package-lock only
        run: |
          set -eu
          test -f website/package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "build(web): rebuild lockfile for Next 16 optional binaries"
          git push origin HEAD:refs/heads/feat/nextjs-rest-atlas-v1

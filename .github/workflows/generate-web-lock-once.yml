name: Refresh website dependency lock once
on:
  push:
    branches: [feat/nextjs-rest-atlas-v1]
    paths:
      - .github/workflows/generate-web-lock-once.yml
permissions:
  contents: write
jobs:
  lock:
    if: github.ref == 'refs/heads/feat/nextjs-rest-atlas-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate locked patched versions
        working-directory: website
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit only npm package-lock
        run: |
          set -eu
          test -f website/package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "build(web): lock patched Next.js 16 dependencies"
          git push origin HEAD:refs/heads/feat/nextjs-rest-atlas-v1

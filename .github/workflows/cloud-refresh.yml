name: Hosted Finland evidence refresh (opt-in, free tier)

on:
  workflow_dispatch:
    inputs:
      day:
        description: "Latest UTC day YYYY-MM-DD (blank = 3 days ago)"
        required: false
        type: string
      backfill_days:
        description: "Number of completed days, 1..7"
        default: "1"
        required: false
        type: choice
        options:
          - "1"
          - "3"
          - "7"
  schedule:
    # Once daily. Avoid high-frequency jobs and Neon free-tier usage.
    - cron: "17 7 * * *"

permissions:
  contents: read

concurrency:
  group: hosted-evidence-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # An account owner must explicitly opt in to enable real-source fetching
    # and public mirror updates. Default: SKIPPED, $0 infrastructure usage.
    if: github.ref == 'refs/heads/main' && vars.ENABLE_PUBLIC_REFRESH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FINGRID_API_KEY: ${{ secrets.FINGRID_API_KEY }}
      ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
      DATABASE_WRITE_URL: ${{ secrets.DATABASE_WRITE_URL }}
      TARGET_DAY: ${{ inputs.day }}
      BACKFILL: ${{ inputs.backfill_days || '1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Check private configuration exists
        run: |
          if [ -z "$FINGRID_API_KEY" ] || [ -z "$ENTSOE_API_TOKEN" ] || [ -z "$DATABASE_WRITE_URL" ]; then
            echo "::error::FINGRID_API_KEY, ENTSOE_API_TOKEN and DATABASE_WRITE_URL must be configured as Actions secrets."
            exit 1
          fi
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch, validate and append into hosted PostgreSQL
        run: python -m src.cloud_sync --day "$TARGET_DAY" --backfill-days "$BACKFILL"

name: Hosted Finland evidence refresh (opt-in, free tier)

on:
  workflow_dispatch:
    inputs:
      day:
        description: "Latest UTC day YYYY-MM-DD (blank = 3 days ago)"
        required: false
        type: string
      backfill_days:
        description: "Number of completed days, 1..7"
        default: "1"
        required: false
        type: choice
        options:
          - "1"
          - "3"
          - "7"
  push:
    # One-shot verification when this modified workflow is merged into main.
    # Remove this trigger before enabling the recurring schedule.
    branches: [main]
    paths: [".github/workflows/cloud-refresh.yml"]
  schedule:
    # Once daily. Avoid high-frequency jobs and Neon free-tier usage.
    - cron: "17 7 * * *"

permissions:
  contents: read

concurrency:
  group: hosted-evidence-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # A one-time push to main validates the next UTC day, then this trigger
    # is removed. Scheduled refresh remains gated by ENABLE_PUBLIC_REFRESH.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || vars.ENABLE_PUBLIC_REFRESH == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FINGRID_API_KEY: ${{ secrets.FINGRID_API_KEY }}
      ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      NEON_BRANCH_NAME: ${{ vars.NEON_BRANCH_NAME || 'production' }}
      NEON_DATABASE_NAME: ${{ vars.NEON_DATABASE_NAME || '' }}
      # Only the one-shot push probes 2026-10-16; normal manual/scheduled
      # runs retain the existing conservative three-day publication lag.
      TARGET_DAY: ${{ github.event_name == 'push' && '2026-10-16' || inputs.day }}
      BACKFILL: ${{ inputs.backfill_days || '1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Check private configuration exists
        run: |
          if [ -z "$FINGRID_API_KEY" ] || [ -z "$ENTSOE_API_TOKEN" ] || [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            echo "::error::FINGRID_API_KEY and ENTSOE_API_TOKEN must be secrets; NEON_API_KEY must be a secret and NEON_PROJECT_ID must be a repository variable."
            exit 1
          fi
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Resolve writer URL securely from Neon GitHub integration
        run: python -m src.neon_connection --export-github-env
      - name: Fetch, validate and append into hosted PostgreSQL
        run: python -m src.cloud_sync --day "$TARGET_DAY" --backfill-days "$BACKFILL"

name: Fingrid live smoke (manual, secret-only)

on:
  workflow_dispatch:
    inputs:
      day:
        description: "Completed UTC date YYYY-MM-DD; blank selects three days ago"
        required: false
        type: string
      kind:
        description: "Which Fingrid operational datasets to check"
        required: true
        default: both
        type: choice
        options:
          - both
          - consumption
          - production

permissions:
  contents: read

jobs:
  authenticated-smoke:
    # This must run on reviewed main code, not a fork or unreviewed PR.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FINGRID_API_KEY: ${{ secrets.FINGRID_API_KEY }}
      SMOKE_DAY: ${{ inputs.day }}
      SMOKE_KIND: ${{ inputs.kind }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Check repository secret is configured
        shell: bash
        run: |
          if [ -z "$FINGRID_API_KEY" ]; then
            echo "::error::Configure FINGRID_API_KEY as a repository Actions secret."
            exit 1
          fi
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Test authenticated data retrieval in a temporary database
        shell: bash
        run: python -m src.live_fingrid --day "$SMOKE_DAY" --kind "$SMOKE_KIND"

name: ENTSO-E live smoke (manual, secret-only)

on:
  workflow_dispatch:
    inputs:
      day:
        description: "Completed UTC day YYYY-MM-DD; blank selects three days ago"
        required: false
        type: string
      kind:
        description: "ENTSO-E data product"
        required: true
        default: load
        type: choice
        options:
          - load
          - generation

permissions:
  contents: read

jobs:
  authenticated-smoke:
    # Never expose a secret to unreviewed PR code or fork runs.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
      SMOKE_DAY: ${{ inputs.day }}
      SMOKE_KIND: ${{ inputs.kind }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Require repository secret
        shell: bash
        run: |
          if [ -z "$ENTSOE_API_TOKEN" ]; then
            echo "::error::Add ENTSOE_API_TOKEN via repository Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Read one completed UTC day and verify temporary SQLite persistence
        shell: bash
        run: python -m src.live_entsoe --day "$SMOKE_DAY" --kind "$SMOKE_KIND"

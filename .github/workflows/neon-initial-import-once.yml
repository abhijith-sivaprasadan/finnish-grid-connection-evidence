name: Neon one-time initial evidence import

on:
  # One-time path-specific trigger when this file is first merged to main.
  # Ordinary code pushes and pull requests do NOT run this bootstrap.
  push:
    branches: [main]
    paths:
      - .github/workflows/neon-initial-import-once.yml

permissions:
  contents: read

concurrency:
  group: hosted-evidence-refresh
  cancel-in-progress: false

jobs:
  initialize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      NEON_BRANCH_NAME: production
      NEON_DATABASE_NAME: ${{ vars.NEON_DATABASE_NAME || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Require preexisting Neon GitHub integration
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            echo "::error::Neon API key and project variables missing. No data written."
            exit 1
          fi
      - name: Install declared Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Discover production writer URI (masked)
        run: python -m src.neon_connection --export-github-env
      - name: Bootstrap source-transcribed capacity sample and verify readback
        run: python -m src.neon_bootstrap
